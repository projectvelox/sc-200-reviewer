  <script>
/*
 * Question rendering. One widget per interaction type.
 *
 * createWidget(q, ctx) -> HTMLElement
 *   ctx.answer    current answer (may be undefined)
 *   ctx.onChange  called with the new answer
 *   ctx.readOnly  inputs are disabled
 *   ctx.reveal    mark the correct answer and the user's selections
 */
(function () {
  "use strict";

  const App = window.App;
  const { h, fmt, plain, icon, uid, announce } = App;
  const E = App.engine;

  /* ---------- Stem blocks ---------- */

  function exhibitSrc(name) {
    const inline = window.EXAM_EXHIBITS;
    return inline && inline[name] ? inline[name] : "assets/exhibits/" + name;
  }

  function codeBlock(code, label) {
    return h("pre", { class: "code", tabindex: "0", role: "group", "aria-label": label || "Code exhibit" }, h("code", null, code));
  }

  function renderBlock(block) {
    if (typeof block === "string") return h("p", null, fmt(block));
    if (block.code !== undefined) {
      return h("figure", { class: "exhibit" },
        block.label ? h("figcaption", { class: "exhibit__label" }, block.label) : null,
        codeBlock(block.code, block.label),
        block.note ? h("p", { class: "exhibit__note" }, block.note) : null);
    }
    if (block.table) {
      const numeric = block.table.numeric || [];
      return h("div", { class: "table-wrap", tabindex: "0", role: "region", "aria-label": "Table exhibit" },
        h("table", { class: "data-table" },
          h("thead", null, h("tr", null, block.table.head.map((c) => h("th", { scope: "col" }, c)))),
          h("tbody", null, block.table.rows.map((row) =>
            h("tr", null, row.map((c, i) => h("td", { class: numeric.includes(i) ? "is-num" : null }, fmt(c))))))));
    }
    if (block.list) return h("ul", { class: "req-list" }, block.list.map((item) => h("li", null, fmt(item))));
    if (block.image) {
      return h("figure", { class: "exhibit exhibit--image" },
        h("img", { src: exhibitSrc(block.image), alt: block.alt || "Exhibit", loading: "lazy" }));
    }
    if (block.heading) return h("h3", { class: "prose__heading" }, block.heading);
    if (block.note) return h("p", { class: "exhibit__note" }, block.note);
    return null;
  }

  function renderBlocks(blocks) {
    return h("div", { class: "prose" }, blocks.map(renderBlock));
  }

  /* ---------- Shared pieces ---------- */

  function hint(text) {
    return h("p", { class: "widget-hint" }, text);
  }

  /** Solid pill used on revealed answers: green with a check, red with a cross. */
  function badge(ok, text) {
    return h("span", { class: "badge badge--" + (ok ? "ok" : "bad") }, icon(ok ? "check" : "close", { size: 14 }), text);
  }

  /** Shows the right value next to a wrong selection. */
  function fixChip(text) {
    return h("span", { class: "fix-chip" }, icon("check", { size: 14 }), h("span", { class: "sr-only" }, "Correct answer: "), text);
  }

  function keyChip(letter, tone) {
    return h("span", { class: "key-chip key-chip--" + tone }, letter);
  }

  /* ---------- Single and multiple choice ---------- */

  function choiceWidget(q, ctx) {
    const multi = q.type === "multi";
    const key = E.keyOf(q);
    const limit = key.length;
    const name = uid("choice");
    let value = (ctx.answer || []).slice();

    const message = h("p", { class: "widget-message", role: "status", hidden: true });
    const legendText = multi ? "Select " + limit + " answers." : "Select one answer.";
    const root = h("fieldset", { class: "choices" },
      h("legend", { class: multi ? "choices__legend" : "sr-only" }, legendText));

    q.options.forEach((opt) => {
      const inputId = uid("opt");
      const selected = value.includes(opt.key);
      const isKey = key.includes(opt.key);
      const input = h("input", {
        type: multi ? "checkbox" : "radio", name, id: inputId, value: opt.key,
        checked: selected, disabled: ctx.readOnly
      });
      input.addEventListener("change", () => {
        if (multi) {
          if (input.checked && value.length >= limit) {
            input.checked = false;
            message.hidden = false;
            message.textContent = "You can select only " + limit + " answers. Clear one of your selections to choose a different answer.";
            return;
          }
          message.hidden = true;
          value = input.checked ? value.concat(opt.key) : value.filter((k) => k !== opt.key);
        } else {
          value = [opt.key];
        }
        root.querySelectorAll(".choice").forEach((row) => row.classList.toggle("is-selected", row.querySelector("input").checked));
        ctx.onChange(value.slice());
      });

      const body = h("div", { class: "choice__body" },
        opt.text ? h("span", null, fmt(opt.text)) : null,
        opt.code ? codeBlock(opt.code, "Option " + opt.key) : null);

      let state = null;
      let verdict = null;
      let stateClass = selected ? " is-selected" : "";
      if (ctx.reveal) {
        // A status icon takes the place of the input so right and wrong read at a glance.
        const kind = isKey ? "ok" : selected ? "bad" : "none";
        state = h("span", { class: "choice__state choice__state--" + kind, "aria-hidden": "true" },
          kind === "none" ? null : icon(kind === "ok" ? "check" : "close", { size: 14 }));
        if (isKey) verdict = badge(true, selected ? "Your answer · Correct" : "Correct answer");
        else if (selected) verdict = badge(false, "Your answer · Incorrect");
        stateClass = " is-revealed" + (isKey ? " is-correct" : selected ? " is-wrong" : " is-dim");
      }

      root.appendChild(h("label", { class: "choice" + stateClass, for: inputId },
        input,
        state,
        h("span", { class: "choice__key" }, opt.key + "."),
        body,
        verdict));
    });

    root.appendChild(message);
    return root;
  }

  /* ---------- Hotspot: Yes / No statements ---------- */

  function yesNoWidget(q, ctx) {
    const key = E.keyOf(q);
    let value = ctx.answer ? ctx.answer.slice() : q.statements.map(() => null);

    const root = h("div", { class: "answer-area" },
      h("h3", { class: "answer-area__title" }, "Answer Area"),
      h("div", { class: "yn" },
        h("div", { class: "yn__head", "aria-hidden": "true" },
          h("span", null, "Statements"), h("span", null, "Yes"), h("span", null, "No"))));
    const grid = root.querySelector(".yn");

    q.statements.forEach((st, i) => {
      const labelId = uid("stmt");
      const name = uid("yn");
      const radio = (val, text) => {
        const input = h("input", { type: "radio", name, checked: value[i] === val, disabled: ctx.readOnly, "aria-label": text });
        input.addEventListener("change", () => { value[i] = val; ctx.onChange(value.slice()); });
        let cls = "yn__cell";
        let mark = null;
        if (ctx.reveal && key[i] === val) { cls += " is-key"; mark = icon("check", { size: 14 }); }
        else if (ctx.reveal && value[i] === val) { cls += " is-miss"; mark = icon("close", { size: 14 }); }
        return h("label", { class: cls }, input, mark, h("span", { class: "yn__cell-text" }, text));
      };
      const stmt = h("div", { class: "yn__stmt", id: labelId },
        h("p", null, fmt(st.text)),
        st.code ? codeBlock(st.code, "Query for statement " + (i + 1)) : null);
      if (ctx.reveal) {
        const ok = value[i] === key[i];
        stmt.appendChild(h("p", { class: "yn__result" },
          badge(ok, ok ? "Correct" : value[i] === null ? "Not answered" : "Incorrect"),
          ok ? null : fixChip(key[i] ? "Yes" : "No")));
      }
      grid.appendChild(h("div", { class: "yn__row", role: "radiogroup", "aria-labelledby": labelId },
        stmt, radio(true, "Yes"), radio(false, "No")));
    });
    return root;
  }

  /* ---------- Hotspot: drop-down selections ---------- */

  function dropdownWidget(q, ctx) {
    const key = E.keyOf(q);
    const value = Object.assign({}, ctx.answer || {});

    const makeSelect = (field, inline) => {
      const select = h("select", {
        class: "select" + (inline ? " select--inline" : ""),
        disabled: ctx.readOnly,
        "aria-label": inline ? plain(field.label) : null
      }, h("option", { value: "" }, inline ? "Select" : "Select an option"));
      field.options.forEach((text, idx) => select.appendChild(h("option", { value: String(idx) }, text)));
      select.value = value[field.id] === undefined || value[field.id] === null ? "" : String(value[field.id]);
      select.addEventListener("change", () => {
        if (select.value === "") delete value[field.id]; else value[field.id] = Number(select.value);
        ctx.onChange(Object.assign({}, value));
      });
      if (!ctx.reveal) return select;
      const ok = value[field.id] === key[field.id];
      select.classList.add(ok ? "is-correct" : "is-wrong");
      return h("span", { class: "select-wrap" }, select,
        h("span", { class: "mark mark--icon " + (ok ? "mark--ok" : "mark--bad") },
          icon(ok ? "check" : "close", { size: 14, label: ok ? "Correct" : "Incorrect" })),
        ok ? null : fixChip(field.options[key[field.id]]));
    };

    const root = h("div", { class: "answer-area" }, h("h3", { class: "answer-area__title" }, "Answer Area"));

    if (q.template) {
      const pre = h("pre", { class: "code code--template" });
      q.template.split(/(\{\{\w+\}\})/).forEach((part) => {
        const m = /^\{\{(\w+)\}\}$/.exec(part);
        if (!m) { pre.appendChild(document.createTextNode(part)); return; }
        pre.appendChild(makeSelect(q.fields.find((f) => f.id === m[1]), true));
      });
      root.appendChild(pre);
    } else {
      const list = h("div", { class: "dd" });
      q.fields.forEach((field) => {
        const id = uid("dd");
        const control = makeSelect(field, false);
        (control.tagName === "SELECT" ? control : control.querySelector("select")).id = id;
        list.appendChild(h("div", { class: "dd__row" }, h("label", { class: "dd__label", for: id }, fmt(field.label)), control));
      });
      root.appendChild(list);
    }
    return root;
  }

  /* ---------- Drag and drop: build an ordered list ---------- */

  function orderWidget(q, ctx) {
    const key = E.keyOf(q);
    let value = (ctx.answer || []).slice();
    let selected = null;
    const locked = !!ctx.readOnly;

    const sourceList = h("ul", { class: "dnd-list", "data-dropzone": "source", "aria-label": q.sourceLabel || "Actions" });
    const answerList = h("ol", { class: "dnd-list dnd-list--answer", "data-dropzone": "answer", "aria-label": "Answer Area" });
    const marker = h("li", { class: "dnd-marker", "aria-hidden": "true" });

    const btn = (name, label, onClick) => {
      const b = h("button", { type: "button", class: "icon-btn", "aria-label": label, title: label, disabled: locked, onclick: onClick }, icon(name));
      return b;
    };
    const toAnswer = btn("right", "Move the selected action to the answer area", () => moveSelected("answer"));
    const toSource = btn("left", "Remove the selected action from the answer area", () => moveSelected("source"));
    const moveUp = btn("up", "Move the selected action up", () => shift(-1));
    const moveDown = btn("down", "Move the selected action down", () => shift(1));

    function commit(focusItem) {
      ctx.onChange(value.slice());
      render();
      if (focusItem !== undefined && focusItem !== null) {
        const el = root.querySelector('[data-item="' + focusItem + '"]');
        if (el) el.focus();
      }
    }

    function place(item, index) {
      value = value.filter((v) => v !== item);
      const at = index === undefined || index === null ? value.length : Math.max(0, Math.min(index, value.length));
      value.splice(at, 0, item);
      announce(plain(q.items[item]) + " placed at position " + (at + 1) + " of " + value.length + ".");
      commit(item);
    }

    function removeItem(item) {
      if (!value.includes(item)) return;
      value = value.filter((v) => v !== item);
      announce(plain(q.items[item]) + " removed from the answer area.");
      commit(item);
    }

    function moveSelected(where) {
      if (selected === null) return;
      if (where === "answer" && !value.includes(selected)) place(selected);
      else if (where === "source") removeItem(selected);
    }

    function shift(delta) {
      const at = value.indexOf(selected);
      const to = at + delta;
      if (at < 0 || to < 0 || to >= value.length) return;
      value.splice(at, 1);
      value.splice(to, 0, selected);
      announce(plain(q.items[selected]) + " moved to position " + (to + 1) + ".");
      commit(selected);
    }

    function itemEl(item, inAnswer, position) {
      const grip = h("span", { class: "dnd-item__grip" }, icon("grip"));
      const el = h("button", {
        type: "button", class: "dnd-item" + (selected === item ? " is-selected" : ""),
        "data-item": String(item), "aria-pressed": selected === item ? "true" : "false", disabled: locked
      }, grip,
        inAnswer ? h("span", { class: "dnd-item__pos" }, String(position + 1)) : null,
        h("span", { class: "dnd-item__text" }, fmt(q.items[item])));
      if (ctx.reveal && inAnswer) {
        const ok = key[position] === item;
        el.classList.add(ok ? "is-correct" : "is-wrong");
        el.appendChild(h("span", { class: "mark mark--icon " + (ok ? "mark--ok" : "mark--bad") }, icon(ok ? "check" : "close", { size: 14, label: ok ? "Correct position" : "Incorrect position" })));
      }
      if (!locked) {
        el.addEventListener("click", () => { selected = selected === item ? null : item; render(); const again = root.querySelector('[data-item="' + item + '"]'); if (again) again.focus(); });
        el.addEventListener("dblclick", () => { selected = item; if (value.includes(item)) removeItem(item); else place(item); });
        el.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight" && !value.includes(item)) { e.preventDefault(); selected = item; place(item); }
          else if (e.key === "ArrowLeft" && value.includes(item)) { e.preventDefault(); selected = item; removeItem(item); }
          else if ((e.altKey || e.ctrlKey) && e.key === "ArrowUp") { e.preventDefault(); selected = item; shift(-1); }
          else if ((e.altKey || e.ctrlKey) && e.key === "ArrowDown") { e.preventDefault(); selected = item; shift(1); }
        });
        App.dnd.draggable(el, { payload: { item }, handle: grip, onStart: () => { selected = item; } });
      }
      return h("li", { class: "dnd-list__row" }, el);
    }

    function insertIndex(y) {
      const rows = Array.from(answerList.querySelectorAll(".dnd-list__row"));
      for (let i = 0; i < rows.length; i += 1) {
        const r = rows[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) return i;
      }
      return rows.length;
    }

    answerList.dndHover = (payload, x, y) => {
      const rows = Array.from(answerList.querySelectorAll(".dnd-list__row"));
      const idx = insertIndex(y);
      if (idx >= rows.length) answerList.appendChild(marker); else answerList.insertBefore(marker, rows[idx]);
    };
    answerList.dndLeave = () => marker.remove();
    answerList.dndDrop = (payload, x, y) => {
      let idx = insertIndex(y);
      const from = value.indexOf(payload.item);
      if (from > -1 && from < idx) idx -= 1;
      selected = payload.item;
      place(payload.item, idx);
    };
    sourceList.dndDrop = (payload) => { selected = payload.item; removeItem(payload.item); render(); };

    function render() {
      App.clear(sourceList);
      App.clear(answerList);
      q.items.forEach((text, item) => { if (!value.includes(item)) sourceList.appendChild(itemEl(item, false)); });
      value.forEach((item, pos) => answerList.appendChild(itemEl(item, true, pos)));
      if (!sourceList.children.length) sourceList.appendChild(h("li", { class: "dnd-empty" }, "All actions have been moved."));
      if (!value.length) answerList.appendChild(h("li", { class: "dnd-empty" }, "Move actions here and arrange them in order."));
      const inAnswer = selected !== null && value.includes(selected);
      toAnswer.disabled = locked || selected === null || inAnswer;
      toSource.disabled = locked || !inAnswer;
      moveUp.disabled = locked || !inAnswer || value.indexOf(selected) === 0;
      moveDown.disabled = locked || !inAnswer || value.indexOf(selected) === value.length - 1;
    }

    const root = h("div", { class: "answer-area answer-area--flush" },
      h("div", { class: "order" },
        h("div", { class: "order__col" }, h("h3", { class: "order__title" }, q.sourceLabel || "Actions"), sourceList),
        h("div", { class: "order__moves" }, toAnswer, toSource),
        h("div", { class: "order__col" }, h("h3", { class: "order__title" }, "Answer Area"), answerList),
        h("div", { class: "order__moves" }, moveUp, moveDown)),
      locked ? null : hint("Drag an action into the answer area, or select it and use the arrow buttons. Use the up and down buttons to change the order."));
    render();
    return root;
  }

  /* ---------- Drag and drop: match values to targets ---------- */

  function matchWidget(q, ctx) {
    const key = E.keyOf(q);
    const value = Object.assign({}, ctx.answer || {});
    let selected = null;
    const locked = !!ctx.readOnly;

    const bank = h("ul", { class: "dnd-list dnd-list--bank", "data-dropzone": "bank", "aria-label": q.sourceLabel || "Values" });
    const slots = {};

    function commit(focusTarget) {
      ctx.onChange(Object.assign({}, value));
      render();
      if (focusTarget && slots[focusTarget]) slots[focusTarget].focus();
    }

    function assign(targetId, source) {
      value[targetId] = source;
      const target = q.targets.find((t) => t.id === targetId);
      announce(q.sources[source] + " placed in " + plain(target.label) + ".");
      selected = null;
      commit(targetId);
    }

    function clearTarget(targetId, focus) {
      if (value[targetId] === undefined) return;
      delete value[targetId];
      announce("Target cleared.");
      commit(focus ? targetId : null);
    }

    bank.dndDrop = (payload) => { if (payload.from) clearTarget(payload.from, false); };

    // A target is a wrapper (the drop zone) holding the target button and,
    // when filled, a separate clear button.
    function makeSlot(target, inline) {
      const wrap = h("span", { class: "slot" + (inline ? " slot--inline" : ""), "data-dropzone": "slot" });
      const button = h("button", { type: "button", class: "slot__target", disabled: locked });
      wrap.dndDrop = (payload) => {
        if (payload.from && payload.from !== target.id) delete value[payload.from];
        assign(target.id, payload.source);
      };
      if (!locked) {
        button.addEventListener("click", () => { if (selected !== null) assign(target.id, selected); });
        button.addEventListener("keydown", (e) => {
          if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); clearTarget(target.id, true); }
        });
        App.dnd.draggable(button, {
          payload: { get source() { return value[target.id]; }, from: target.id },
          disabled: () => value[target.id] === undefined
        });
      }
      slots[target.id] = button;
      wrap.appendChild(button);
      // The group leaves room beside the target for the correct value when revealed.
      return h("span", { class: "slot-group" }, wrap);
    }

    function fillSlot(target) {
      const button = slots[target.id];
      const wrap = button.parentElement;
      wrap.querySelectorAll(".slot__clear, .mark").forEach((el) => el.remove());
      const source = value[target.id];
      const filled = source !== undefined && source !== null;
      const name = plain(target.label);
      wrap.classList.toggle("is-filled", filled);
      wrap.classList.remove("is-correct", "is-wrong");
      button.textContent = filled ? q.sources[source] : " ";
      button.setAttribute("aria-label", filled
        ? name + " " + q.sources[source] + "." + (locked ? "" : " Press Delete to clear.")
        : name + " Empty." + (locked ? "" : " Select a value, then activate this target to place it."));
      if (filled && !locked) {
        wrap.appendChild(h("button", {
          type: "button", class: "slot__clear", "aria-label": "Clear " + name, title: "Clear",
          onclick: () => clearTarget(target.id, true)
        }, icon("close", { size: 12 })));
      }
      if (ctx.reveal) {
        const ok = filled && source === key[target.id];
        wrap.classList.add(ok ? "is-correct" : "is-wrong");
        wrap.appendChild(h("span", { class: "mark mark--icon " + (ok ? "mark--ok" : "mark--bad") }, icon(ok ? "check" : "close", { size: 14, label: ok ? "Correct" : "Incorrect" })));
        if (!ok) wrap.parentElement.appendChild(fixChip(q.sources[key[target.id]]));
      }
    }

    function render() {
      App.clear(bank);
      q.sources.forEach((text, source) => {
        const grip = h("span", { class: "dnd-item__grip" }, icon("grip"));
        const el = h("button", {
          type: "button", class: "dnd-item" + (selected === source ? " is-selected" : ""),
          "aria-pressed": selected === source ? "true" : "false", disabled: locked, "data-source": String(source)
        }, grip, h("span", { class: "dnd-item__text" }, text));
        if (!locked) {
          el.addEventListener("click", () => {
            selected = selected === source ? null : source;
            render();
            const again = bank.querySelector('[data-source="' + source + '"]');
            if (again) again.focus();
            if (selected !== null) announce(text + " selected. Choose a target to place it.");
          });
          App.dnd.draggable(el, { payload: { source }, handle: grip });
        }
        bank.appendChild(h("li", { class: "dnd-list__row" }, el));
      });
      q.targets.forEach(fillSlot);
      root.classList.toggle("has-selection", selected !== null);
    }

    let area;
    if (q.template) {
      area = h("pre", { class: "code code--template" });
      q.template.split(/(\{\{\w+\}\})/).forEach((part) => {
        const m = /^\{\{(\w+)\}\}$/.exec(part);
        if (!m) { area.appendChild(document.createTextNode(part)); return; }
        area.appendChild(makeSlot(q.targets.find((t) => t.id === m[1]), true));
      });
    } else {
      area = h("div", { class: "match__targets" }, q.targets.map((target) =>
        h("div", { class: "match__row" }, h("span", { class: "match__label" }, fmt(target.label)), makeSlot(target, false))));
    }

    const root = h("div", { class: "answer-area answer-area--flush" },
      h("div", { class: "match" },
        h("div", { class: "match__col match__col--bank" }, h("h3", { class: "order__title" }, q.sourceLabel || "Values"), bank),
        h("div", { class: "match__col" }, h("h3", { class: "order__title" }, "Answer Area"), area)),
      locked ? null : hint("Drag a value to a target, or select a value and then select the target. A value can be used more than once. Use the clear button on a target to empty it."));
    render();
    return root;
  }

  /* ---------- Factory ---------- */

  function createWidget(q, ctx) {
    switch (q.type) {
      case "single": case "multi": return choiceWidget(q, ctx);
      case "yesno": return yesNoWidget(q, ctx);
      case "dropdown": return dropdownWidget(q, ctx);
      case "order": return orderWidget(q, ctx);
      case "dragdrop": return matchWidget(q, ctx);
      default: return h("p", null, "Unsupported question type: " + q.type);
    }
  }

  /* ---------- Explanation panel ---------- */

  const isChoice = (q) => q.type === "single" || q.type === "multi";

  function joinLetters(keys) {
    const list = keys.slice().sort();
    return list.length > 1 ? list.slice(0, -1).join(", ") + " and " + list[list.length - 1] : list[0];
  }

  /**
   * The verdict strip shown directly above the answer options, so the result
   * and the marked options are visible together without scrolling.
   */
  function renderResult(q, answer, opts) {
    const o = opts || {};
    const g = E.grade(q, answer);
    const key = E.keyOf(q);
    const partial = g.status === "incorrect" && g.points > 0 && g.max > 1;
    const title = g.status === "correct" ? "Correct"
      : g.status === "unanswered" ? "Not answered"
      : partial ? "Incorrect \u2014 " + g.points + " of " + g.max + " selections correct" : "Incorrect";
    const statusIcon = g.status === "correct" ? "check" : g.status === "unanswered" ? "dash" : "close";

    const pair = (label, chips) => h("span", { class: "result__pair" }, h("span", { class: "result__label" }, label), chips);
    let detail;
    if (isChoice(q)) {
      const mine = g.status === "unanswered" ? null
        : pair("Your answer", answer.slice().sort().map((k) => keyChip(k, key.includes(k) ? "ok" : "bad")));
      detail = [mine, g.status === "correct" ? null : pair("Correct answer", key.slice().sort().map((k) => keyChip(k, "ok")))];
    } else {
      detail = g.status === "correct" ? null
        : h("span", { class: "result__hint" }, g.status === "unanswered"
          ? "The correct answer is listed under Correct answer below."
          : q.type === "order"
            ? "A green check marks each action that is in the right position. A red cross marks each one that is not. The correct order is listed below."
            : "A green check marks each correct selection. A red cross marks each of yours that is wrong, with the correct value beside it.");
    }

    return h("div", { class: "result result--" + g.status, tabindex: "-1" },
      h("span", { class: "result__status" },
        h("span", { class: "result__icon" }, icon(statusIcon, { size: 16 })),
        h("strong", { class: "result__title" }, title)),
      detail,
      o.flagged ? h("span", { class: "tag tag--flag" }, icon("flag", { size: 12 }), "Marked for review") : null);
  }

  function answerLines(q, value, useKey) {
    if (isChoice(q)) {
      const key = E.keyOf(q);
      const keys = (useKey ? key : value || []).slice().sort();
      if (!keys.length) return h("p", { class: "muted" }, "No answer selected.");
      return h("ul", { class: "answer-lines" }, keys.map((k) => {
        const opt = q.options.find((x) => x.key === k);
        return h("li", null, keyChip(k, key.includes(k) ? "ok" : "bad"), opt && opt.text ? h("span", null, fmt(opt.text)) : h("span", null, "Option " + k));
      }));
    }
    const lines = E.describe(q, value, useKey);
    if (!lines.length) return h("p", { class: "muted" }, "No answer selected.");
    return h("ul", { class: "answer-lines" }, lines.map((l) => h("li", null, l)));
  }

  function answerCard(tone, iconName, title, body, wide) {
    return h("div", { class: "answer-card answer-card--" + tone + (wide ? " answer-card--wide" : "") },
      h("h4", { class: "answer-card__title" }, icon(iconName, { size: 14 }), title), body);
  }

  function renderFeedback(q, answer) {
    const g = E.grade(q, answer);
    const ex = q.explanation;
    const key = E.keyOf(q);
    const chosen = isChoice(q) && Array.isArray(answer) ? answer : [];

    const section = (title, ...kids) => h("section", { class: "fb__section" }, h("h4", { class: "fb__heading" }, title), kids);

    const cards = g.status === "correct"
      ? answerCard("ok", "check", "Your answer \u2014 correct", answerLines(q, answer, false), true)
      : [
        g.status === "unanswered"
          ? answerCard("none", "dash", "Your answer", h("p", { class: "muted" }, "No answer selected."))
          : answerCard("bad", "close", "Your answer", answerLines(q, answer, false)),
        answerCard("ok", "check", "Correct answer", answerLines(q, null, true))
      ];

    const whyTitle = isChoice(q)
      ? "Why " + joinLetters(key) + (key.length > 1 ? " are" : " is") + " correct"
      : "Why this is correct";

    // For choice questions each wrong option is labelled with its letter and
    // whether it was the user's pick.
    const reasons = ex.wrong && ex.wrong.length
      ? h("dl", { class: "reasons" }, ex.wrong.map(([label, reason]) => {
        const term = isChoice(q)
          ? h("dt", null, keyChip(label, "bad"), chosen.includes(label) ? h("span", { class: "tag" }, "Your answer") : null)
          : h("dt", null, fmt(label));
        return [term, h("dd", null, fmt(reason))];
      }))
      : null;

    return h("div", { class: "fb", role: "region", "aria-label": "Answer explanation" },
      h("div", { class: "fb__answers" }, cards),
      h("section", { class: "fb__section" },
        h("h4", { class: "fb__heading fb__heading--ok" }, icon("check", { size: 16 }), whyTitle),
        ex.correct.map((p) => h("p", null, fmt(p)))),
      reasons ? h("section", { class: "fb__section" },
        h("h4", { class: "fb__heading" + (q.type === "yesno" ? "" : " fb__heading--bad") },
          q.type === "yesno" ? null : icon("close", { size: 16 }),
          q.type === "yesno" ? "Statement by statement" : "Why the other options are incorrect"),
        reasons) : null,
      ex.logic ? section("Elimination logic", h("p", null, fmt(ex.logic))) : null,
      section("Concept tested", h("p", null, fmt(ex.concept))),
      h("section", { class: "fb__section fb__takeaway" }, h("h4", { class: "fb__heading" }, "Exam takeaway"), h("p", null, fmt(ex.takeaway))),
      ex.refs && ex.refs.length ? section("Reference",
        h("ul", { class: "plain-list" }, ex.refs.map(([label, url]) => h("li", null, h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, label))))) : null,
      h("dl", { class: "fb__meta" },
        h("div", null, h("dt", null, "Skill area"), h("dd", null, E.data.domains[q.domain])),
        h("div", null, h("dt", null, "Topic"), h("dd", null, q.topic)),
        h("div", null, h("dt", null, "Type"), h("dd", null, E.TYPE_LABELS[q.type])),
        h("div", null, h("dt", null, "Difficulty"), h("dd", null, q.difficulty)),
        h("div", null, h("dt", null, "Source"), h("dd", null, "Question " + q.source))));
  }

  App.widgets = { renderBlocks, createWidget, renderResult, renderFeedback };
})();

</script>
  <script>
/* The exam shell: live sessions (Exam mode and Reviewer mode) and post-exam answer review. */
(function () {
  "use strict";

  const App = window.App;
  const { h, clear, fmt, icon, dialog, announce, formatDuration, formatSpan, store, uid } = App;
  const E = App.engine;
  const W = App.widgets;
  const D = E.data;

  const WIDE = "(min-width: 900px)";

  /* ---------- Scenario (case) pane ---------- */

  function buildCasePane(caseDef, activeId, onSelect) {
    const panelId = uid("case-panel");
    const tablist = h("div", { class: "tabs", role: "tablist", "aria-label": "Scenario sections" });
    const panel = h("div", { class: "case__panel", role: "tabpanel", id: panelId, tabindex: "0" });
    let current = caseDef.sections.find((s) => s.id === activeId) || caseDef.sections[0];

    function select(section, focus) {
      current = section;
      clear(tablist);
      caseDef.sections.forEach((s, i) => {
        const on = s === current;
        const tab = h("button", {
          type: "button", class: "tab" + (on ? " is-active" : ""), role: "tab", id: panelId + "-tab-" + s.id,
          "aria-selected": on ? "true" : "false", "aria-controls": panelId, tabindex: on ? "0" : "-1"
        }, s.title);
        tab.addEventListener("click", () => select(s, true));
        tab.addEventListener("keydown", (e) => {
          const n = caseDef.sections.length;
          let to = null;
          if (e.key === "ArrowRight") to = (i + 1) % n;

  /**
   * Builds the content of the main area for one question.
   * opts: { number, total, answer, readOnly, reveal, onChange, flagged,
   *         caseTab, onCaseTab, pane, onPane, caseProgress, locked }
   */
  function buildQuestionLayout(q, opts) {
    const typeLabel = { single: "", multi: "Multiple response", yesno: "Hotspot", dropdown: "Hotspot", order: "Drag and drop", dragdrop: "Drag and drop" }[q.type];
    const article = h("article", { class: "question", "aria-labelledby": "question-title" },
      h("header", { class: "question__head" },
        h("h1", { class: "question__title", id: "question-title", tabindex: "-1" }, "Question " + opts.number),
        typeLabel ? h("span", { class: "question__type" }, typeLabel) : null,
        opts.caseProgress ? h("span", { class: "question__type" }, opts.caseProgress) : null),
      opts.locked ? h("p", { class: "banner banner--info" }, icon("lock"), "This question belongs to a scenario set and is locked. It cannot be changed.") : null,
      W.renderBlocks(q.stem),
      // The verdict sits directly above the options so both are seen together.
      h("div", { class: "answer-block" },
        opts.reveal ? W.renderResult(q, opts.answer, { flagged: opts.flagged }) : null,
        W.createWidget(q, { answer: opts.answer, readOnly: opts.readOnly, reveal: opts.reveal, onChange: opts.onChange })),

    const caseDef = D.cases[q.caseId];
    const layout = h("div", { class: "layout layout--case", "data-pane": opts.pane || "question" });
    const width = store.get("prefs.split", 42);
    layout.style.setProperty("--case-width", width + "%");

    const paneSwitch = h("div", { class: "pane-switch", role: "group", "aria-label": "Show scenario or question" });
    const setPane = (name) => {
      layout.dataset.pane = name;
      paneSwitch.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.name === name ? "true" : "false"));
      opts.onPane(name);
    };
    [["scenario", "Scenario set"], ["question", "Question " + opts.number]].forEach(([name, label]) => {
      paneSwitch.appendChild(h("button", { type: "button", class: "pane-switch__btn", "data-name": name, "aria-pressed": (opts.pane || "question") === name ? "true" : "false", onclick: () => setPane(name) }, label));
    });

    // Split bar between the scenario and the question (desktop).
    const splitter = h("div", {
      class: "splitter", role: "separator", "aria-orientation": "vertical", tabindex: "0",
      "aria-label": "Resize scenario and question panes", "aria-valuemin": "25", "aria-valuemax": "65", "aria-valuenow": String(width)
    });
    const applyWidth = (pct) => {
      const w = Math.max(25, Math.min(65, Math.round(pct)));

      splitter.addEventListener("pointermove", onMove);

    });

    layout.appendChild(paneSwitch);
    layout.appendChild(h("div", { class: "layout__pane layout__pane--case" }, buildCasePane(caseDef, opts.caseTab, opts.onCaseTab)));
    layout.appendChild(splitter);
    layout.appendChild(h("div", { class: "layout__pane layout__pane--question" }, article));
    return layout;
  }

  function caseProgressLabel(q, order) {
    if (!q.caseId) return null;
    const members = order.filter((id) => E.byId.get(id).caseId === q.caseId);
    return "Solution " + (members.indexOf(q.id) + 1) + " of " + members.length;
  }

  /* ---------- Navigator ---------- */

  /**
   * cfg: { count, current, info(i) -> { label, classes[], icons[], disabled },
   *        legend [{ classes, icon, text }], onPick(i), actions [{ label, kind, run }] }
   */
  function openNavigator(cfg) {
    const titleId = uid("nav-title");
    const dlg = h("dialog", { class: "drawer", "aria-labelledby": titleId });
    const close = () => { if (dlg.open) dlg.close(); dlg.remove(); };
    const grid = h("div", { class: "nav-grid", role: "list" });

    for (let i = 0; i < cfg.count; i += 1) {
      const info = cfg.info(i);
      const cell = h("button", {
        type: "button", class: "nav-cell " + info.classes.join(" ") + (i === cfg.current ? " is-current" : ""),
        "aria-label": info.label, "aria-current": i === cfg.current ? "true" : null, disabled: info.disabled
      }, h("span", { class: "nav-cell__num" }, String(i + 1)), info.icons.map((name) => icon(name, { size: 11, class: "nav-cell__icon nav-cell__icon--" + name })));
      cell.addEventListener("click", () => { close(); cfg.onPick(i); });
      grid.appendChild(h("div", { role: "listitem" }, cell));
    }

    dlg.appendChild(h("div", { class: "drawer__head" },
      h("h2", { class: "drawer__title", id: titleId }, "Question navigator"),
      h("button", { type: "button", class: "icon-btn icon-btn--plain", "aria-label": "Close navigator", onclick: close }, icon("close"))));
    dlg.appendChild(h("div", { class: "drawer__body" },
      cfg.summary ? h("p", { class: "drawer__summary" }, cfg.summary) : null,
      grid,
      h("ul", { class: "legend" }, cfg.legend.map((item) =>
        h("li", null, h("span", { class: "nav-cell nav-cell--sample " + item.classes, "aria-hidden": "true" },
          h("span", { class: "nav-cell__num" }, item.icon ? "" : "1"), item.icon ? icon(item.icon, { size: 11, class: "nav-cell__icon nav-cell__icon--" + item.icon }) : null), item.text)))));
    dlg.appendChild(h("div", { class: "drawer__foot" }, cfg.actions.map((a) =>
      h("button", { type: "button", class: "btn btn--" + (a.kind || "secondary"), onclick: () => { close(); a.run(); } }, a.label))));

    dlg.addEventListener("cancel", (e) => { e.preventDefault(); close(); });
    dlg.addEventListener("click", (e) => { if (e.target === dlg) close(); });
    document.body.appendChild(dlg);
    dlg.showModal();
    const cur = dlg.querySelector(".nav-cell.is-current") || dlg.querySelector(".nav-cell");
    if (cur) { cur.focus(); cur.scrollIntoView({ block: "center" }); }
    return close;
  }

  /* ---------- Live session ---------- */

  function liveExam(mount) {
    const session = E.loadSession();
    if (!session) { App.go("#/"); return; }

    const isExam = session.mode === "exam";
    const total = session.order.length;
    const qAt = (i) => E.byId.get(session.order[i]);
    const cur = () => qAt(session.index);
    const save = () => E.saveSession(session);

    let screen = "question";
    let filter = "all";
    let ticker = null;
    let closeNav = null;
    let finished = false;

    const counter = h("div", { class: "exam-bar__count" });
    const timerValue = h("span", { class: "timer__value" });
    const timer = h("div", { class: "timer", role: "timer" },
      icon("clock"), h("span", { class: "timer__label" }, session.timeLimitSec ? "Time remaining" : "Time elapsed"), timerValue);
    const navButton = h("button", { type: "button", class: "bar-btn", "aria-label": "Question navigator", onclick: showNavigator }, icon("grid"), h("span", { class: "bar-btn__text" }, "Navigator"));
    const bar = h("header", { class: "exam-bar" },
      h("div", { class: "exam-bar__title" }, h("strong", null, D.exam.code), h("span", null, isExam ? "Exam mode" : "Reviewer mode")),
      counter,
      h("div", { class: "exam-bar__right" }, timer, navButton));
    const progressFill = h("div", { class: "progress__fill" });
    const progress = h("div", { class: "progress", role: "progressbar", "aria-label": "Questions answered", "aria-valuemin": "0", "aria-valuemax": String(total) }, progressFill);
    const tools = h("div", { class: "exam-tools" });
    const main = h("main", { class: "exam-main", id: "exam-main", tabindex: "-1" });
    const foot = h("footer", { class: "exam-foot" });
    mount.appendChild(h("div", { class: "exam" }, bar, progress, tools, main, foot));

    /* --- state helpers --- */

    const stateOf = (i) => E.answerState(qAt(i), session.answers[session.order[i]]);
    const isLocked = (i) => !!session.locked[session.order[i]];
    const counts = () => {
      const c = { complete: 0, partial: 0, none: 0, flagged: 0 };
      session.order.forEach((id, i) => { c[stateOf(i)] += 1; if (session.flags[id]) c.flagged += 1; });
      return c;
    };

    function prevIndex() { for (let i = session.index - 1; i >= 0; i -= 1) if (!isLocked(i)) return i; return -1; }
    function nextIndex() { for (let i = session.index + 1; i < total; i += 1) if (!isLocked(i)) return i; return -1; }

    function updateProgress() {
      const c = counts();
      progress.setAttribute("aria-valuenow", String(c.complete));
      progress.setAttribute("aria-valuetext", c.complete + " of " + total + " answered");
      progressFill.style.width = (total ? (c.complete / total) * 100 : 0) + "%";
      const el = tools.querySelector("[data-progress]");
      if (el) el.textContent = "Answered " + c.complete + " of " + total + (c.flagged ? " · Marked " + c.flagged : "");
    }

    function updateTimer() {
      if (session.timeLimitSec) {
        const left = Math.max(0, session.timeLimitSec - session.elapsedSec);
        timerValue.textContent = formatDuration(left);
        timer.classList.toggle("is-low", left <= 300);
        if (left === 300) announce("Five minutes remaining.");
        if (left === 60) announce("One minute remaining.");
      } else {
        timerValue.textContent = formatDuration(session.elapsedSec);
      }
    }

    function startTicker() {
      if (ticker) return;
      ticker = window.setInterval(() => {
        session.elapsedSec += 1;
        updateTimer();
        if (session.elapsedSec % 5 === 0) save();
        if (session.timeLimitSec && session.elapsedSec >= session.timeLimitSec) timeUp();
      }, 1000);
    }
    function stopTicker() { window.clearInterval(ticker); ticker = null; }

    App.onDispose(() => { stopTicker(); if (closeNav) closeNav(); if (!finished) save(); });

    /* --- finishing --- */

    function complete(status) {
      finished = true;
      stopTicker();
      if (closeNav) closeNav();
      const attempt = E.finishSession(session, status);
      return attempt;
    }

    async function timeUp() {
      if (finished) return;
      document.querySelectorAll("dialog[open]").forEach((d) => { d.close(); d.remove(); });
      const attempt = complete("Timed out");
      await dialog({
        title: "Time has expired",
        body: "The time allowed for this exam has ended. Your answers have been submitted.",
        actions: [{ label: "View results", value: true, kind: "primary" }],
        dismissible: false
      });
      App.go("#/results/" + attempt.id);
    }

    async function submit() {
      const c = counts();
      const open = c.none + c.partial;
      const lines = [];
      if (open) lines.push("**" + open + (open === 1 ? " question is" : " questions are") + " unanswered or incomplete.** Unanswered questions are scored as incorrect.");
      if (c.flagged) lines.push(c.flagged + (c.flagged === 1 ? " question is" : " questions are") + " still marked for review.");
      lines.push(isExam ? "After you submit, you cannot change your answers. Your results are shown immediately." : "This ends the session and saves your score to your history.");
      const ok = await dialog({
        title: isExam ? "Submit exam?" : "Finish session?",
        body: lines,
        actions: [
          { label: isExam ? "Return to exam" : "Return to session", value: false, kind: "secondary" },
          { label: isExam ? "Submit exam" : "Finish session", value: true, kind: "primary" }
        ]
      });
      if (!ok) return;
      const attempt = complete("Completed");
      App.go("#/results/" + attempt.id);
    }

    async function saveAndExit() {
      save();
      App.go("#/");
    }

    async function abandon() {
      const ok = await dialog({
        title: "End session without submitting?",
        body: ["The session will be closed and recorded in your history as abandoned. It does not count toward your average score.", "To keep your place and continue later, choose Save and exit instead."],
        actions: [{ label: "Cancel", value: false, kind: "secondary" }, { label: "End session", value: true, kind: "danger" }]
      });
      if (!ok) return;
      complete("Abandoned");
      App.go("#/");
    }

    /* --- navigation --- */

    async function confirmLeave() {
      const q = cur();
      const noReturn = isExam && session.noReturn && q.caseId && D.cases[q.caseId].noReturn && !session.locked[q.id];
      if (!noReturn) return true;
      const answered = E.answerState(q, session.answers[q.id]) === "complete";
      const ok = await dialog({
        title: "Leave this question?",
        body: [
          "This question is part of a scenario set. After you leave it, you will NOT be able to return to it, and it will not appear on the review screen.",
          answered ? null : "**You have not answered this question.**"
        ],
        actions: [{ label: "Stay on this question", value: false, kind: "secondary" }, { label: "Continue", value: true, kind: "primary" }]
      });
      if (!ok) return false;
      session.locked[q.id] = true;
      delete session.flags[q.id];
      return true;
    }

    async function goTo(index) {
      if (index < 0 || index >= total) return;
      if (screen === "question" && index !== session.index && !(await confirmLeave())) return;
      session.index = index;
      screen = "question";
      save();
      renderQuestion(true);
    }

    async function goNext() {
      const next = nextIndex();
      if (next === -1) { if (await confirmLeave()) { save(); showReview(); } return; }
      goTo(next);
    }

    async function showReview() {
      if (screen === "question" && !(await confirmLeave())) return;
      screen = "review";
      save();
      renderReview();
    }

    /* --- question screen --- */

    function renderTools(q) {
      clear(tools);
      const locked = !!session.locked[q.id];
      const flagId = uid("flag");
      const flag = h("input", { type: "checkbox", id: flagId, checked: !!session.flags[q.id], disabled: locked });
      flag.addEventListener("change", () => {
        if (flag.checked) session.flags[q.id] = true; else delete session.flags[q.id];
        save();
        updateProgress();
        announce(flag.checked ? "Question marked for review." : "Mark for review removed.");
      });
      tools.appendChild(h("div", { class: "exam-tools__left" }, h("span", { "data-progress": "1" })));
      tools.appendChild(h("label", { class: "flag-toggle", for: flagId }, flag, icon("flag"), h("span", null, "Mark for review")));
    }

    function renderFoot(q) {
      clear(foot);
      const locked = !!session.locked[q.id];
      const checked = !!session.checked[q.id];
      const prev = prevIndex();
      const last = nextIndex() === -1;
      const hasAnswer = E.answerState(q, session.answers[q.id]) !== "none";

      foot.appendChild(h("div", { class: "exam-foot__group" },
        h("button", { type: "button", class: "btn btn--secondary", disabled: prev === -1, onclick: () => goTo(prev) }, icon("left"), "Previous"),
        h("button", { type: "button", class: "btn btn--subtle exam-foot__review", onclick: showReview }, "Review screen")));

      const right = h("div", { class: "exam-foot__group" });
      if (!isExam && !checked && !locked) {
        right.appendChild(h("button", { type: "button", class: "btn btn--primary", "data-check": "1", onclick: checkAnswer }, hasAnswer ? "Check answer" : "Show answer"));
      }
      const nextKind = !isExam && !checked ? "secondary" : "primary";
      right.appendChild(h("button", { type: "button", class: "btn btn--" + nextKind, onclick: goNext }, last ? "Review screen" : "Next", icon("right")));
      foot.appendChild(right);
    }

    function renderQuestion(focus) {
      const q = cur();
      const index = session.index;
      const firstVisit = q.caseId && !session.caseTab[q.caseId];
      session.visited[q.id] = true;
      counter.textContent = "Question " + (index + 1) + " of " + total;
      renderTools(q);

      const locked = !!session.locked[q.id];
      const checked = !isExam && !!session.checked[q.id];
      clear(main).appendChild(buildQuestionLayout(q, {
        number: index + 1,
        total,
        answer: session.answers[q.id],
        readOnly: locked || checked,
        reveal: checked,
        locked,
        flagged: !!session.flags[q.id],
        caseTab: session.caseTab[q.caseId],
        onCaseTab: (id) => { session.caseTab[q.caseId] = id; save(); },
        // On a narrow screen, open the scenario first the first time a set is entered.
        pane: firstVisit ? "scenario" : "question",
        onPane: () => {},
        caseProgress: caseProgressLabel(q, session.order),
        onChange: (value) => {
          if (E.answerState(q, value) === "none") delete session.answers[q.id]; else session.answers[q.id] = value;
          save();
          updateProgress();
          const check = foot.querySelector("[data-check]");
          if (check) check.textContent = E.answerState(q, value) !== "none" ? "Check answer" : "Show answer";
        }
      }));
      renderFoot(q);
      updateProgress();
      save();
      main.scrollTop = 0;
      main.querySelectorAll(".layout__pane").forEach((p) => { p.scrollTop = 0; });
      if (focus) {
        const title = main.querySelector("#question-title");
        if (title) title.focus({ preventScroll: true });
      }
    }

    function checkAnswer() {

      save();
      renderQuestion(false);
      const g = E.grade(q, session.answers[q.id]);
      announce(g.status === "correct" ? "Correct." : g.status === "unanswered" ? "Not answered. The correct answer is shown." : "Incorrect. The correct answer is shown.");
      // Keep the verdict and the marked options on screen; the explanation follows below.
      const result = main.querySelector(".result");
      const block = main.querySelector(".answer-block");
      if (result) result.focus({ preventScroll: true });
      if (block) block.scrollIntoView({ block: "nearest", behavior: "auto" });
    }

    /* --- review screen --- */

    function statusLabel(i) {
      if (isLocked(i)) return "Locked";
      const s = stateOf(i);
      return s === "complete" ? "Answered" : s === "partial" ? "Incomplete" : "Unanswered";
    }

    function renderReview() {
      counter.textContent = "Review screen";
      clear(tools);
      tools.appendChild(h("div", { class: "exam-tools__left" }, h("span", { "data-progress": "1" })));
      updateProgress();

      const c = counts();
      const filters = [
        ["all", "All questions", total],
        ["open", "Unanswered or incomplete", c.none + c.partial],
        ["flagged", "Marked for review", c.flagged]
      ];
      const rows = [];
      session.order.forEach((id, i) => {
        const s = stateOf(i);
        if (filter === "open" && s === "complete") return;
        if (filter === "flagged" && !session.flags[id]) return;
        rows.push(i);
      });

      const table = h("table", { class: "data-table data-table--rows" },
        h("thead", null, h("tr", null,
          h("th", { scope: "col", class: "col-num" }, "No."), h("th", { scope: "col" }, "Question"),
          h("th", { scope: "col" }, "Status"), h("th", { scope: "col" }, "Marked"))),
        h("tbody", null, rows.map((i) => {
          const q = qAt(i);
          const locked = isLocked(i);
          const s = stateOf(i);
          const checkedHere = !isExam && session.checked[q.id];
          const result = checkedHere ? E.grade(q, session.answers[q.id]).status : null;
          return h("tr", null,
            h("td", { class: "col-num" }, String(i + 1)),
            h("td", null, locked
              ? h("span", { class: "muted" }, E.summaryLine(q))
              : h("button", { type: "button", class: "link-btn", onclick: () => goTo(i) }, E.summaryLine(q))),
            h("td", null, h("span", { class: "status status--" + (locked ? "locked" : s) },
              icon(locked ? "lock" : s === "complete" ? "check" : s === "partial" ? "dash" : "warn", { size: 14 }), statusLabel(i)),
              result ? h("span", { class: "status status--" + result }, result === "correct" ? "Checked: correct" : result === "incorrect" ? "Checked: incorrect" : "Checked") : null),
            h("td", null, session.flags[q.id] ? h("span", { class: "status status--flag" }, icon("flag", { size: 14 }), "Marked") : h("span", { class: "muted" }, "—")));
        })));

      clear(main).appendChild(h("div", { class: "layout layout--single" },
        h("div", { class: "review-screen" },
          h("h1", { class: "question__title", id: "question-title", tabindex: "-1" }, "Review screen"),
          h("p", null, isExam
            ? "Review your answers before you submit. Select a question to return to it. Questions from scenario sets that you have left are locked and cannot be reopened."
            : "Select a question to return to it. When you are done, finish the session to save your score."),
          h("dl", { class: "stat-row" },
            h("div", null, h("dt", null, "Answered"), h("dd", null, String(c.complete))),
            h("div", null, h("dt", null, "Incomplete"), h("dd", null, String(c.partial))),
            h("div", null, h("dt", null, "Unanswered"), h("dd", null, String(c.none))),
            h("div", null, h("dt", null, "Marked for review"), h("dd", null, String(c.flagged)))),
          h("div", { class: "filter-row", role: "group", "aria-label": "Filter questions" }, filters.map(([name, label, n]) =>
            h("button", { type: "button", class: "chip-btn", "aria-pressed": filter === name ? "true" : "false", onclick: () => { filter = name; renderReview(); } }, label + " (" + n + ")"))),
          rows.length ? h("div", { class: "table-wrap" }, table) : h("p", { class: "empty" }, "No questions match this filter."))));

      clear(foot);
      const back = isLocked(session.index) ? (prevIndex() !== -1 ? prevIndex() : nextIndex()) : session.index;
      foot.appendChild(h("div", { class: "exam-foot__group" },
        h("button", { type: "button", class: "btn btn--secondary", disabled: back === -1, onclick: () => goTo(back) }, icon("left"), "Return to question " + (back + 1)),
        h("button", { type: "button", class: "btn btn--subtle", onclick: saveAndExit }, "Save and exit")));
      foot.appendChild(h("div", { class: "exam-foot__group" },
        h("button", { type: "button", class: "btn btn--primary", onclick: submit }, isExam ? "Submit exam" : "Finish session")));
      main.scrollTop = 0;
      const title = main.querySelector("#question-title");
      if (title) title.focus({ preventScroll: true });
    }

    /* --- navigator --- */

    function showNavigator() {
      const c = counts();
      closeNav = openNavigator({
        count: total,
        current: screen === "question" ? session.index : -1,
        summary: "Answered " + c.complete + " of " + total + ". Incomplete " + c.partial + ". Marked for review " + c.flagged + ".",
        info: (i) => {
          const q = qAt(i);
          const s = stateOf(i);
          const locked = isLocked(i);
          const flagged = !!session.flags[q.id];
          const result = !isExam && session.checked[q.id] ? E.grade(q, session.answers[q.id]).status : null;
          const icons = [];
          if (locked) icons.push("lock");
          if (flagged) icons.push("flag");
          if (result === "correct") icons.push("check");
          if (result === "incorrect" || result === "unanswered") icons.push("close");
          const words = ["Question " + (i + 1), statusLabel(i)];
          if (flagged) words.push("Marked for review");
          if (result) words.push(result === "correct" ? "Checked, correct" : "Checked, incorrect");
          if (i === session.index && screen === "question") words.push("Current question");
          return { label: words.join(". ") + ".", classes: ["is-" + s, locked ? "is-locked" : "", flagged ? "is-flagged" : ""], icons, disabled: locked };
        },
        legend: [
          { classes: "is-current", text: "Current question" },
          { classes: "is-complete", text: "Answered" },
          { classes: "is-partial", text: "Incomplete" },
          { classes: "is-none", text: "Unanswered" },
          { classes: "is-none is-flagged", icon: "flag", text: "Marked for review" }
        ].concat(isExam && session.noReturn ? [{ classes: "is-none is-locked", icon: "lock", text: "Locked (scenario set)" }] : [])
          .concat(!isExam ? [{ classes: "is-complete", icon: "check", text: "Checked, correct" }, { classes: "is-complete", icon: "close", text: "Checked, incorrect" }] : []),
        onPick: (i) => goTo(i),
        actions: [
          { label: "Review screen", kind: "primary", run: showReview },
          { label: "Save and exit", kind: "secondary", run: saveAndExit },

    }

    /* --- instructions screen --- */

    function renderIntro() {
      counter.textContent = total + (total === 1 ? " question" : " questions");
      clear(tools);
      const sets = Array.from(new Set(session.order.map((id) => E.byId.get(id).caseId).filter(Boolean)));
      const rules = [];
      if (isExam) {
        rules.push("This session contains " + total + " questions. Answers are not scored or revealed until you submit the exam.");
        rules.push(session.timeLimitSec
          ? "You have " + formatSpan(session.timeLimitSec) + ". The timer starts when you select Begin and the exam is submitted automatically when time runs out."
          : "This session is not timed. Elapsed time is recorded.");
        rules.push("Use Previous and Next to move between questions. Use Mark for review to flag a question, and the Navigator or Review screen to return to it.");
        rules.push("Some questions are worth more than one point. Each correct selection in a hotspot, drag and drop or multiple response question is worth one point.");
        if (sets.length && session.noReturn) rules.push("This session includes " + sets.length + (sets.length === 1 ? " scenario set" : " scenario sets") + ". After you leave a question in a scenario set, you cannot return to it.");
        else if (sets.length) rules.push("This session includes " + sets.length + (sets.length === 1 ? " scenario set" : " scenario sets") + ". The scenario stays on screen while you answer its questions.");
      } else {
        rules.push("This session contains " + total + " questions. After you answer a question, select Check answer to see whether you were correct, with a full explanation.");
        rules.push("After an answer is checked it is locked. You can still move between questions and reread explanations.");
        rules.push("This session is not timed. Your score is saved to your history when you finish the session.");
        if (sets.length) rules.push("This session includes " + sets.length + (sets.length === 1 ? " scenario set" : " scenario sets") + ". The scenario stays on screen while you answer its questions.");
      }
      const requested = session.requested === "all" ? null : session.requested;
      clear(main).appendChild(h("div", { class: "layout layout--single" },
        h("div", { class: "intro" },
          h("h1", { class: "question__title", id: "question-title", tabindex: "-1" }, isExam ? "Exam instructions" : "Reviewer session"),
          h("p", { class: "intro__exam" }, D.exam.code + ": " + D.exam.title),
          requested && requested > total ? h("p", { class: "banner banner--info" }, icon("info"),
            "You requested " + requested + " questions. " + total + " are available in the selected pool, so this session contains " + total + ".") : null,
          h("ul", { class: "req-list" }, rules.map((r) => h("li", null, r))))));
      clear(foot);
      foot.appendChild(h("div", { class: "exam-foot__group" },
        h("button", { type: "button", class: "btn btn--secondary", onclick: () => { finished = true; E.clearSession(); App.go("#/"); } }, "Cancel")));
      foot.appendChild(h("div", { class: "exam-foot__group" },
        h("button", { type: "button", class: "btn btn--primary", onclick: begin }, isExam ? "Begin exam" : "Begin session", icon("right"))));
      timerValue.textContent = session.timeLimitSec ? formatDuration(session.timeLimitSec) : "00:00";
      navButton.disabled = true;
      const title = main.querySelector("#question-title");
      if (title) title.focus({ preventScroll: true });
    }

    function begin() {
      session.begun = true;
      session.startedAt = Date.now();
      navButton.disabled = false;
      save();
      startTicker();
      updateTimer();
      renderQuestion(true);
    }

    /* --- start --- */

    if (!session.begun) {
      renderIntro();
    } else {
      // A resumed session never reopens a locked scenario question.
      if (isLocked(session.index)) {
        const n = nextIndex();
        const p = prevIndex();
        if (n !== -1) session.index = n; else if (p !== -1) session.index = p; else screen = "review";
      }
      updateTimer();
      startTicker();
      if (screen === "review") renderReview(); else renderQuestion(true);
    }
  }

  /* ---------- Post-exam answer review ---------- */

  function answerReview(mount, attemptId, initialFilter, startAt) {
    const attempt = E.getAttempt(attemptId);
    if (!attempt) { App.go("#/history"); return; }

    const filters = {
      all: { label: "All questions", test: () => true },
      incorrect: { label: "Incorrect", test: (id) => attempt.results[id].status === "incorrect" },
      unanswered: { label: "Unanswered", test: (id) => attempt.results[id].status === "unanswered" },
      flagged: { label: "Marked for review", test: (id) => !!(attempt.flags && attempt.flags[id]) }
    };
    let filter = filters[initialFilter] ? initialFilter : "all";
    let list = [];
    let pos = 0;
    const caseTab = {};
    let closeNav = null;

    const counter = h("div", { class: "exam-bar__count" });
    const navButton = h("button", { type: "button", class: "bar-btn", "aria-label": "Question navigator", onclick: showNavigator }, icon("grid"), h("span", { class: "bar-btn__text" }, "Navigator"));
    const bar = h("header", { class: "exam-bar" },
      h("div", { class: "exam-bar__title" }, h("strong", null, D.exam.code), h("span", null, "Answer review")),
      counter, h("div", { class: "exam-bar__right" }, navButton));
    const tools = h("div", { class: "exam-tools" });
    const main = h("main", { class: "exam-main", id: "exam-main", tabindex: "-1" });
    const foot = h("footer", { class: "exam-foot" });
    mount.appendChild(h("div", { class: "exam exam--review" }, bar, tools, main, foot));
    App.onDispose(() => { if (closeNav) closeNav(); });

    function applyFilter(name, keepId) {
      filter = name;
      list = attempt.order.filter((id) => filters[name].test(id));
      pos = Math.max(0, keepId ? list.indexOf(keepId) : 0);
      render(true);
    }

    function renderTools() {
      clear(tools);
      const selectId = uid("filter");
      const select = h("select", { class: "select select--compact", id: selectId });
      Object.keys(filters).forEach((name) => {
        const n = attempt.order.filter((id) => filters[name].test(id)).length;
        select.appendChild(h("option", { value: name }, filters[name].label + " (" + n + ")"));
      });
      select.value = filter;
      select.addEventListener("change", () => applyFilter(select.value, null));
      tools.appendChild(h("div", { class: "exam-tools__left" }, h("label", { class: "inline-label", for: selectId }, "Show"), select));
      const id = list[pos];
      if (id && attempt.flags && attempt.flags[id]) tools.appendChild(h("span", { class: "status status--flag" }, icon("flag", { size: 14 }), "Marked for review"));
    }

    function render(focus) {
      renderTools();
      clear(foot);
      const back = h("button", { type: "button", class: "btn btn--subtle", onclick: () => App.go("#/results/" + attempt.id) }, "Back to results");
      if (!list.length) {
        counter.textContent = "No questions";
        clear(main).appendChild(h("div", { class: "layout layout--single" }, h("p", { class: "empty" }, "No questions match this filter.")));
        foot.appendChild(h("div", { class: "exam-foot__group" }, back));
        return;
      }
      const id = list[pos];
      const q = E.byId.get(id);
      const number = attempt.order.indexOf(id) + 1;
      counter.textContent = "Question " + number + " of " + attempt.order.length + (filter === "all" ? "" : " · " + (pos + 1) + " of " + list.length + " shown");
      clear(main).appendChild(buildQuestionLayout(q, {
        number,
        total: attempt.order.length,
        answer: attempt.answers[id],
        readOnly: true,
        reveal: true,
        flagged: !!(attempt.flags && attempt.flags[id]),
        caseTab: caseTab[q.caseId],
        onCaseTab: (tab) => { caseTab[q.caseId] = tab; },
        pane: "question",
        onPane: () => {},
        caseProgress: caseProgressLabel(q, attempt.order),
        onChange: () => {}
      }));
      E.markReviewed([id]);
      foot.appendChild(h("div", { class: "exam-foot__group" },
        h("button", { type: "button", class: "btn btn--secondary", disabled: pos === 0, onclick: () => { pos -= 1; render(true); } }, icon("left"), "Previous"),
        back));
      foot.appendChild(h("div", { class: "exam-foot__group" },
        h("button", { type: "button", class: "btn btn--primary", disabled: pos >= list.length - 1, onclick: () => { pos += 1; render(true); } }, "Next", icon("right"))));
      main.scrollTop = 0;
      main.querySelectorAll(".layout__pane").forEach((p) => { p.scrollTop = 0; });
      if (focus) {
        const title = main.querySelector("#question-title");
        if (title) title.focus({ preventScroll: true });
      }
    }

    function showNavigator() {
      closeNav = openNavigator({
        count: attempt.order.length,
        current: list.length ? attempt.order.indexOf(list[pos]) : -1,
        summary: attempt.correct + " correct, " + attempt.incorrect + " incorrect, " + attempt.unanswered + " unanswered.",
        info: (i) => {
          const id = attempt.order[i];
          const status = attempt.results[id].status;
          const flagged = !!(attempt.flags && attempt.flags[id]);
          const icons = [status === "correct" ? "check" : status === "incorrect" ? "close" : "dash"];
          if (flagged) icons.push("flag");
          return {
            label: "Question " + (i + 1) + ". " + (status === "correct" ? "Correct" : status === "incorrect" ? "Incorrect" : "Unanswered") + (flagged ? ". Marked for review" : "") + ".",
            classes: ["is-result-" + status, flagged ? "is-flagged" : ""], icons, disabled: false
          };
        },
        legend: [
          { classes: "is-result-correct", icon: "check", text: "Correct" },
          { classes: "is-result-incorrect", icon: "close", text: "Incorrect" },
          { classes: "is-result-unanswered", icon: "dash", text: "Unanswered" },
          { classes: "is-result-unanswered is-flagged", icon: "flag", text: "Marked for review" }
        ],
        onPick: (i) => applyFilter("all", attempt.order[i]),
        actions: [{ label: "Back to results", kind: "primary", run: () => App.go("#/results/" + attempt.id) }]
      });
    }

    list = attempt.order.filter((id) => filters[filter].test(id));
    const startId = startAt ? attempt.order[startAt - 1] : null;
    if (startId && !list.includes(startId)) { filter = "all"; list = attempt.order.slice(); }
    pos = startId ? Math.max(0, list.indexOf(startId)) : 0;
    render(true);
  }

  App.exam = { liveExam, answerReview };
})();

  /* ---------- Page chrome ---------- */
